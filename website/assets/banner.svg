<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f1e3d"/>
      <stop offset="1" stop-color="#10294f"/>
    </linearGradient>
    <linearGradient id="pred" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.7" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- logo mark: flask -->
  <g transform="translate(70,70)" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-18" y="-18" width="76" height="76" rx="18" fill="#2563eb" stroke="none"/>
    <path d="M8 0h24" />
    <path d="M14 0v17l-11 19a3 3 0 0 0 2.6 4.5h25.8a3 3 0 0 0 2.6-4.5L26 17V0"/>
    <path d="M5 30h30"/>
  </g>

  <!-- title + tagline -->
  <text x="70" y="178" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-1">OpenFoldUI</text>
  <text x="72" y="214" fill="#7dd3fc" font-size="23" font-weight="700" letter-spacing="2">THE ALPHAFOLD COMPANION</text>
  <text x="72" y="242" fill="#93c5fd" font-size="22" font-weight="500">Inspect, validate &amp; compare AlphaFold predictions — in your browser.</text>

  <!-- metric pills -->
  <g font-size="18" font-weight="600">
    <g transform="translate(72,262)">
      <rect width="92" height="34" rx="17" fill="#1e293b" stroke="#334155"/><text x="46" y="23" fill="#e2e8f0" text-anchor="middle">RMSD</text>
    </g>
    <g transform="translate(176,262)">
      <rect width="116" height="34" rx="17" fill="#1e293b" stroke="#334155"/><text x="58" y="23" fill="#e2e8f0" text-anchor="middle">TM-score</text>
    </g>
    <g transform="translate(304,262)">
      <rect width="96" height="34" rx="17" fill="#1e293b" stroke="#334155"/><text x="48" y="23" fill="#e2e8f0" text-anchor="middle">GDT-TS</text>
    </g>
    <g transform="translate(412,262)">
      <rect width="80" height="34" rx="17" fill="#1e293b" stroke="#334155"/><text x="40" y="23" fill="#e2e8f0" text-anchor="middle">lDDT</text>
    </g>
    <g transform="translate(504,262)">
      <rect width="196" height="34" rx="17" fill="#1e293b" stroke="#334155"/><text x="98" y="23" fill="#e2e8f0" text-anchor="middle">pLDDT &#8596; error</text>
    </g>
  </g>

  <!-- structure overlay motif -->
  <g transform="translate(0,-6)">
    <path d="M740 150 C 800 90, 840 90, 880 134 S 960 200, 1010 150 S 1110 70, 1150 130"
          fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
    <path d="M740 156 C 800 96, 840 96, 880 140 S 960 206, 1010 156 S 1120 40, 1162 96"
          fill="none" stroke="url(#pred)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="1096" cy="64" r="9" fill="#ef4444"/>
    <circle cx="1096" cy="64" r="17" fill="none" stroke="#ef4444" stroke-width="2.5" opacity="0.45"/>
    <text x="1058" y="40" fill="#fca5a5" font-size="17" font-weight="600" text-anchor="end">confidently wrong</text>
  </g>
</svg>
